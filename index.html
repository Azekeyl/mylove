<!DOCTYPE html>

<head>

<title>For You</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <h2>may surprise ako sayo...</h2>
  <p class="sub">pindutin mo yung envelope 👇</p>

  <div class="envelope" id="envelope" onclick="openEnvelope()">

      <div style="font-size:32px;">💐</div>
      <h1>I Love You</h1>
      <p>kahit pagod ka,<br>nandito lang ako.<br>hindi kita iiwan.</p>
      <div class="big-heart">❤️</div>
    </div>

    <div class="body"></div>
    <div class="flap" id="flap"></div>
    <div class="seal" id="seal">❤️</div>
  </div>

  <p class="sub" id="msg">click mo yung envelope, beh</p>
</div>

<script src="game.js"></script>
</body>
</html>
